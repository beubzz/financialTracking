<main class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">$</span><span>Ledgerly</span></div>
    <nav aria-label="Navigation principale">
      <a
        class="nav-item"
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span aria-hidden="true">◈</span>Vue d'ensemble
      </a>
      <a class="nav-item" routerLink="/transactions" routerLinkActive="active">
        <span aria-hidden="true">▤</span>Transactions
      </a>
      <a class="nav-item" routerLink="/objectifs" routerLinkActive="active">
        <span aria-hidden="true">⌁</span>Objectifs
      </a>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span>Synchronisation active</div>
  </aside>
  <section class="content-area">
    <header class="topbar">
      <div>
        <p class="eyebrow">{{ eyebrow() }}</p>
        <h1>{{ title() }}</h1>
      </div>
      <ng-content select="[layout-actions]"></ng-content>
    </header>
    <div class="content-inner">
      <ng-content></ng-content>
    </div>
  </section>
</main>
