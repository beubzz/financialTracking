<div class="modal-backdrop" (click)="close.emit()">
  <section class="expense-modal" role="dialog" aria-modal="true" aria-labelledby="expense-title" (click)="$event.stopPropagation()">
    <div class="modal-header"><div><p class="eyebrow">Nouvelle ligne</p><h2 id="expense-title">{{ section() === 'mandatory' ? 'Dépense obligatoire' : (section() === 'pleasure' ? 'Plaisir ou projet' : (section() === 'investment' ? 'Investissement' : 'Dépense variable')) }}</h2></div><button class="close-button" type="button" (click)="close.emit()" aria-label="Fermer">×</button></div>
    <label class="field-label" for="expense-label">Libellé</label><input class="text-input" id="expense-label" [ngModel]="label()" (ngModelChange)="label.set($event)" placeholder="Ex. Loyer, essence, cinéma..." autocomplete="off">
    <label class="field-label" for="expense-amount">Prix</label><div class="amount-input"><input class="text-input" id="expense-amount" type="number" [ngModel]="amount()" (ngModelChange)="amount.set($event)" min="0.01" step="0.01" placeholder="0,00"><span>€</span></div>
    <fieldset><legend class="field-label">Récurrence</legend><div class="radio-group"><label [class.selected]="recurrence() === 'week'"><input type="radio" name="recurrence" value="week" [ngModel]="recurrence()" (ngModelChange)="recurrence.set($event)">Semaine</label><label [class.selected]="recurrence() === 'month'"><input type="radio" name="recurrence" value="month" [ngModel]="recurrence()" (ngModelChange)="recurrence.set($event)">Mois</label><label [class.selected]="recurrence() === 'year'"><input type="radio" name="recurrence" value="year" [ngModel]="recurrence()" (ngModelChange)="recurrence.set($event)">Année</label></div></fieldset>
    <div class="modal-actions"><button class="cancel-button" type="button" (click)="close.emit()">Annuler</button><button class="primary-button" type="button" (click)="submitForm.emit()">{{ editing() ? 'Enregistrer' : 'Ajouter la ligne' }}</button></div>
  </section>
</div>
