services:
  - type: web
    name: financial-tracking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/frontend/browser

  - type: web
    name: financial-tracking-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate --schema ../prisma/schema.prisma && npm run build
    startCommand: npx prisma migrate deploy --schema ../prisma/schema.prisma && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: financial-tracking-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: NODE_VERSION
        value: 22.22.3

databases:
  - name: financial-tracking-db
    databaseName: financial_tracking
    user: financial_tracking
